[pytest]
timeout = 900
timeout_method = thread
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: deterministic test with no network, local services, model calls, sleeps, or persistent runtime data
    integration: internal stage composition using temporary files but no internet or local model dependency
    external: opt-in test that requires internet, Sky, Ollama, GB10, or another live service
