<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Console</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top bar */
        .top-bar {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }

        .top-bar h1 {
            font-size: 1.4em;
            color: #e94560;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.error {
            background: #ef4444;
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Chat pane */
        .chat-pane {
            flex: 7;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #0f3460;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 85%;
        }

        .message.user {
            background: #0f3460;
            margin-left: auto;
        }

        .message.assistant {
            background: #16213e;
            border: 1px solid #0f3460;
        }

        .message-header {
            font-size: 0.75em;
            color: #888;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .message-content {
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message-badge {
            font-size: 0.7em;
            background: #e94560;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }

        /* Input area */
        .input-area {
            padding: 16px;
            background: #16213e;
            border-top: 1px solid #0f3460;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .input-container textarea {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #eee;
            padding: 12px;
            font-family: inherit;
            font-size: 0.95em;
            resize: none;
            min-height: 48px;
            max-height: 120px;
        }

        .input-container textarea:focus {
            outline: none;
            border-color: #e94560;
        }

        .input-container button {
            background: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .input-container button:hover {
            background: #d1345a;
        }

        .input-container button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* Right panel */
        .right-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-section {
            padding: 16px;
            border-bottom: 1px solid #0f3460;
        }

        .panel-section h3 {
            font-size: 0.9em;
            color: #e94560;
            margin-bottom: 12px;
        }

        .context-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .context-item {
            background: #16213e;
            padding: 8px 10px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 0.8em;
        }

        .context-item .kind {
            color: #e94560;
            font-weight: 600;
        }

        .context-item .score {
            color: #888;
            font-size: 0.9em;
        }

        .plots-section {
            flex: 1;
            overflow-y: auto;
        }

        .plot-item {
            background: #16213e;
            padding: 8px 10px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 0.8em;
        }

        .plot-item a {
            color: #4ade80;
            text-decoration: none;
        }

        .plot-item a:hover {
            text-decoration: underline;
        }

        .empty-state {
            color: #666;
            font-size: 0.85em;
            font-style: italic;
        }

        /* Loading indicator */
        .loading {
            display: none;
            color: #888;
            font-size: 0.85em;
            padding: 8px 0;
        }

        .loading.active {
            display: block;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>Apollo Console</h1>
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connected</span>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-pane">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-header">
                        <span>Apollo</span>
                    </div>
                    <div class="message-content">Hello! I'm Apollo, your financial assistant. Ask me anything about markets, investing, taxes, or personal finance.</div>
                </div>
            </div>
            <div class="loading" id="loadingIndicator">Apollo is thinking...</div>
            <div class="input-area">
                <div class="input-container">
                    <textarea id="userInput" placeholder="Type your message... (Ctrl+Enter to send)" rows="1"></textarea>
                    <button id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="panel-section">
                <h3>Context Documents</h3>
                <div class="context-list" id="contextList">
                    <div class="empty-state">No context loaded yet</div>
                </div>
            </div>
            <div class="panel-section plots-section">
                <h3>Plots & Artifacts</h3>
                <div id="plotsList">
                    <div class="empty-state">No plots available</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentConversationId = null;
        let isLoading = false;

        // DOM elements
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const contextList = document.getElementById('contextList');
        const plotsList = document.getElementById('plotsList');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkHealth();
            loadPlots();

            // Auto-resize textarea
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            // Ctrl+Enter to send
            userInput.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });

        // Check API health
        async function checkHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();

                if (data.status === 'healthy') {
                    statusDot.classList.remove('error');
                    statusText.textContent = `Connected (${data.document_count} docs)`;
                } else {
                    statusDot.classList.add('error');
                    statusText.textContent = 'Error: ' + (data.error || 'Unknown');
                }
            } catch (e) {
                statusDot.classList.add('error');
                statusText.textContent = 'Disconnected';
            }
        }

        // Load plots
        async function loadPlots() {
            try {
                const response = await fetch('/api/plots/recent');
                const data = await response.json();

                if (data.plots && data.plots.length > 0) {
                    plotsList.innerHTML = data.plots.map(plot => `
                        <div class="plot-item">
                            <a href="${plot.url}" target="_blank">${plot.filename}</a>
                        </div>
                    `).join('');
                } else {
                    plotsList.innerHTML = '<div class="empty-state">No plots available</div>';
                }
            } catch (e) {
                plotsList.innerHTML = '<div class="empty-state">Failed to load plots</div>';
            }
        }

        // Send message
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isLoading) return;

            // Clear input
            userInput.value = '';
            userInput.style.height = 'auto';

            // Add user message to chat
            addMessage('user', message);

            // Show loading
            isLoading = true;
            sendBtn.disabled = true;
            loadingIndicator.classList.add('active');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        conversation_id: currentConversationId
                    })
                });

                const data = await response.json();

                if (data.error) {
                    addMessage('assistant', 'Error: ' + data.error);
                    statusDot.classList.add('error');
                    statusText.textContent = 'Error';
                } else {
                    // Update conversation ID
                    currentConversationId = data.conversation_id;

                    // Add assistant message
                    const badge = data.context && data.context.length > 0 ? 'RAG' : null;
                    addMessage('assistant', data.reply, badge, data.metadata);

                    // Update context panel
                    updateContext(data.context);

                    // Update status
                    statusDot.classList.remove('error');
                    statusText.textContent = `Connected (${data.metadata.latency_ms}ms)`;
                }
            } catch (e) {
                addMessage('assistant', 'Failed to connect to Apollo. Please check that the server is running.');
                statusDot.classList.add('error');
                statusText.textContent = 'Disconnected';
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                loadingIndicator.classList.remove('active');
            }
        }

        // Add message to chat
        function addMessage(role, content, badge = null, metadata = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            let headerContent = role === 'user' ? 'You' : 'Apollo';
            if (badge) {
                headerContent += `<span class="message-badge">${badge}</span>`;
            }

            let metaInfo = '';
            if (metadata && role === 'assistant') {
                metaInfo = ` | ${metadata.model}`;
            }

            messageDiv.innerHTML = `
                <div class="message-header">
                    <span>${headerContent}</span>
                    <span style="font-size: 0.9em; color: #666;">${metaInfo}</span>
                </div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Update context panel
        function updateContext(context) {
            if (!context || context.length === 0) {
                contextList.innerHTML = '<div class="empty-state">No context used</div>';
                return;
            }

            contextList.innerHTML = context.map(doc => `
                <div class="context-item">
                    <span class="kind">${doc.kind}</span>
                    <span class="score">(${doc.score.toFixed(3)})</span>
                    ${doc.source ? `<br><small>${doc.source}</small>` : ''}
                </div>
            `).join('');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
