# =============================================================================
# 4. AUTO-RAG & GOVERNANCE CAPABILITIES
# =============================================================================
auto_rag_governance:
  rag_proposal_engine_integrated: true
  integration_location: "apollo_deepmode/controller.py"

  proposal_generation_mechanism:
    description: "RAGProposalEngine analyzes retrieval statistics and metadata distribution to generate human-reviewable maintenance proposals"
    triggers:
      - "After deep-mode analysis with context"
      - "When intent is: markets, personal_finance, investing, risk, macro"
    output: "rag_proposals field in analysis result"

  proposal_types:
    - action: "identify_high_distance_queries"
      description: "Flag queries with sparse vector matches"
    - action: "update_embedding_model"
      description: "Suggest model upgrade when precision < 35%"
    - action: "re_chunk"
      description: "Recommend re-chunking when many queries return zero relevant docs"
    - action: "re_ingest_file"
      description: "Re-ingest specific sources with issues"
    - action: "re_ingest_category"
      description: "Expand underrepresented categories"
    - action: "expand_category"
      description: "Broaden low-frequency category coverage"
    - action: "flag_stale_documents"
      description: "Identify outdated documents for refresh"

  thresholds:
    precision_threshold: 0.4
    distance_threshold: 0.35
    category_target: 10
    stale_document_days: 365

  permissions:
    apollo_can_modify: false
    auto_changes_allowed: false
    requires_confirmation: true
    user_must_approve: true

  system_prompt_governance:
    enabled: true
    instruction: "Apollo may suggest RAG maintenance actions but must never perform any RAG changes without explicit user confirmation."
    location: "config/system_prompt.txt (line 1)"

  api_exposure:
    endpoint: "/meta"
    governance_block:
      rag_proposals_enabled: true
      auto_changes_allowed: false
      requires_confirmation: true

  log_file:
    path: "logs/rag_proposals.log"
    exists: true
    format: "JSONL with timestamp and proposal payload"

